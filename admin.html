<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Gift Website</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .back-link {
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            align-self: flex-start;
            margin-bottom: 15px;
        }
        .admin-header {
            background-color: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .admin-header h2 {
            color: #ff9800;
            font-size: 18px;
            margin: 0 0 8px 0;
        }
        .admin-header p {
            font-size: 11px;
            color: #ccc;
            margin: 0;
            line-height: 1.4;
        }
        .section-title {
            color: #ff9800;
            font-size: 16px;
            font-weight: bold;
            align-self: flex-start;
            margin-bottom: 15px;
            max-width: 400px;
            width: 100%;
        }
        .item-box {
            background-color: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }
        .preview-img {
            width: 50px;
            height: 50px;
            background-color: #262626;
            border-radius: 8px;
            border: 1px solid #ff9800;
            object-fit: cover;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 11px;
            color: #ff9800;
            font-weight: bold;
        }
        .input-group input {
            background-color: #262626;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            padding: 8px;
            font-size: 12px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        .save-btn {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
            box-shadow: 0px 4px 10px rgba(255, 152, 0, 0.4);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Back to User Panel</a>

    <div class="admin-header">
        <h2>Admin Panel - Gift Website</h2>
        <p>Yahan se naam aur Image URL change karke niche 'SAVE CHANGES' par click karein.</p>
    </div>

    <div class="section-title">Manage 9 Rewards</div>

    <div id="adminFormContainer">
        <!-- JS Inputs -->
    </div>

    <button class="save-btn" onclick="saveChanges()">SAVE CHANGES</button>

    <script>
        const defaultItems = [
            { name: "BUNNY BUNDLE", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "PIRATE FLAG", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "DIAMONDS", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 4", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 5", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 6", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 7", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 8", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 9", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" }
        ];

        let savedItems = JSON.parse(localStorage.getItem('ffRewards')) || defaultItems;
        const container = document.getElementById('adminFormContainer');

        savedItems.forEach((item, index) => {
            container.innerHTML += `
                <div class="item-box">
                    <img src="${item.img}" class="preview-img" id="prev_${index}" alt="Preview">
                    <div class="input-group">
                        <label>Item ${index + 1} Name</label>
                        <input type="text" id="name_${index}" value="${item.name}">
                    </div>
                    <div class="input-group">
                        <label>Image URL</label>
                        <input type="text" id="img_${index}" value="${item.img}" oninput="document.getElementById('prev_${index}').src = this.value">
                    </div>
                </div>
            `;
        });

        function saveChanges() {
            let updatedItems = [];
            for (let i = 0; i < 9; i++) {
                let name = document.getElementById(`name_${i}`).value;
                let img = document.getElementById(`img_${i}`).value;
                updatedItems.push({ name: name, img: img });
            }
            localStorage.setItem('ffRewards', JSON.stringify(updatedItems));
            alert("Changes saved successfully! Now check your main website.");
        }
    </script>

</body>
</html>
