<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE FIRE REWARDS</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            padding: 20px 0 10px 0;
        }
        .header h1 {
            color: #ff9800;
            font-size: 22px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        .header p {
            color: #aaa;
            font-size: 11px;
            margin: 0;
        }
        .main-card {
            background-color: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 15px;
            width: 90%;
            max-width: 380px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.3);
            box-sizing: border-box;
        }
        .sub-header {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .instruction {
            font-size: 11px;
            color: #ccc;
            text-align: center;
            margin-bottom: 15px;
        }
        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }
        .reward-item {
            background-color: #262626;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .reward-item.active {
            border-color: #ff9800;
            background-color: #332211;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }
        .reward-item img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 5px;
            background-color: #000;
        }
        .reward-item span {
            font-size: 10px;
            color: #ddd;
            font-weight: bold;
        }
        .claim-btn {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-shadow: 0px 4px 10px rgba(255, 152, 0, 0.4);
            border: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .footer-note {
            font-size: 10px;
            color: #888;
            margin-top: 10px;
            text-align: center;
        }
        .admin-link {
            display: block;
            margin-top: 15px;
            color: #ff9800;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
        }
        /* Popup Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 0 20px rgba(255,152,0,0.5);
        }
        .modal-content h2 {
            color: #ffcc00;
            font-size: 20px;
            margin: 10px 0;
        }
        .modal-content p {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 20px;
        }
        .modal-btn {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }
        /* Falling Gifts */
        .gift-box {
            position: fixed;
            top: -50px;
            width: 30px;
            height: 30px;
            background-image: url('https://raw.githubusercontent.com/dipakgamer98/FreeFireReward/main/image_search_1788236237970.jpg');
            background-size: cover;
            z-index: 999;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FREE FIRE REWARDS</h1>
        <p>👑 DIPAK GAMER</p>
    </div>

    <div class="main-card">
        <div class="sub-header">🏆 PREMIUM REWARDS COLLECTION</div>
        <div class="instruction">Select any item below to preview your choice.</div>

        <div class="rewards-grid" id="userGrid">
            <!-- Dynamically Loaded Items -->
        </div>

        <button class="claim-btn" onclick="triggerClaim()">CLAIM NOW</button>
        <div class="footer-note">Select any reward</div>
    </div>

    <a href="admin.html" class="admin-link">⚙️ Go to Admin Panel</a>

    <!-- Success Popup Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div style="font-size: 35px;">🎁</div>
            <h2>CONGRATULATIONS!</h2>
            <p>Reward Sent Mail Box.</p>
            <button class="modal-btn" onclick="closeModal()">OKAY</button>
        </div>
    </div>

    <script>
        const diamondImg = "https://raw.githubusercontent.com/dipakgamer98/FreeFireReward/main/image_search_1788236237970.jpg";
        const defaultItems = [
            { name: "PROXY SERVER", img: diamondImg },
            { name: "LOL EMOTE", img: diamondImg },
            { name: "DIAMONDS", img: diamondImg },
            { name: "BUNDLE", img: diamondImg },
            { name: "GUN SKIN", img: diamondImg },
            { name: "GLOO WALL", img: diamondImg },
            { name: "PET", img: diamondImg },
            { name: "CHARACTER", img: diamondImg },
            { name: "CUSTOM ROOM", img: diamondImg }
        ];

        let savedItems = JSON.parse(localStorage.getItem('ffRewards')) || defaultItems;
        const grid = document.getElementById('userGrid');

        savedItems.forEach((item, index) => {
            grid.innerHTML += `
                <div class="reward-item ${index === 0 ? 'active' : ''}" onclick="selectItem(this)">
                    <img src="${item.img}" alt="Item">
                    <span>${item.name}</span>
                </div>
            `;
        });

        function selectItem(element) {
            const items = document.querySelectorAll('.reward-item');
            items.forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }

        function triggerClaim() {
            document.getElementById('successModal').style.display = 'flex';
            startGiftRain();
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
            window.location.href = "https://1024terabox.com/s/1Po9NS3IRCASNtAWaJ2lUTA";
        }

        function startGiftRain() {
            for (let i = 0; i < 30; i++) {
                let gift = document.createElement('div');
                gift.className = 'gift-box';
                gift.style.left = Math.random() * window.innerWidth + 'px';
                gift.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                gift.style.opacity = Math.random();
                document.body.appendChild(gift);
                setTimeout(() => gift.remove(), 3000);
            }
        }
    </script>

</body>
</html>
