<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE FIRE REWARDS</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            padding: 20px 0 10px 0;
        }
        .header h1 {
            color: #ff9800;
            font-size: 24px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.4);
        }
        .header p {
            color: #ccc;
            font-size: 12px;
            margin: 0;
            font-weight: bold;
        }
        .main-card {
            background: linear-gradient(180deg, #161616, #0d0d0d);
            border: 2px solid #ff9800;
            border-radius: 20px;
            width: 92%;
            max-width: 400px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.25);
            box-sizing: border-box;
        }
        .sub-header {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            font-weight: bold;
            font-size: 13px;
            padding: 10px 15px;
            border-radius: 25px;
            margin-bottom: 8px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }
        .instruction {
            font-size: 11px;
            color: #aaa;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }
        .reward-item {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            border: 2px solid #333;
            transition: 0.2s;
        }
        .reward-item.active {
            border-color: #ffcc00;
            background-color: #261c0a;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.6);
        }
        .reward-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 6px;
            background-color: #000;
        }
        .reward-item span {
            font-size: 9px;
            color: #ddd;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .claim-btn {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-shadow: 0px 4px 15px rgba(255, 152, 0, 0.4);
            border: none;
            cursor: pointer;
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }
        .selection-count {
            font-size: 11px;
            color: #ff9800;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
        .admin-link {
            display: block;
            margin-top: 20px;
            color: #ff9800;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
        }
        /* Popup Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #161616;
            border: 2px solid #ff9800;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 0 25px rgba(255,152,0,0.5);
        }
        .modal-content h2 {
            color: #ffcc00;
            font-size: 20px;
            margin: 10px 0;
        }
        .modal-content p {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 20px;
        }
        .modal-btn {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
        }
        /* Falling Gifts */
        .gift-box {
            position: fixed;
            top: -50px;
            width: 30px;
            height: 30px;
            background-image: url('https://raw.githubusercontent.com/dipakgamer98/FreeFireReward/main/image_search_1788236237970.jpg');
            background-size: cover;
            z-index: 999;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FREE FIRE REWARDS</h1>
        <p>👑 DIPAK GAMER</p>
    </div>

    <div class="main-card">
        <div class="sub-header">🏆 PREMIUM REWARDS COLLECTION</div>
        <div class="instruction">Select any item below to preview your choice in this demo showcase.</div>

        <div class="rewards-grid" id="userGrid">
            <!-- Dynamically Loaded Items -->
        </div>

        <button class="claim-btn" onclick="triggerClaim()">CLAIM NOW</button>
        <div class="selection-count" id="selectionText">0 reward selected</div>
    </div>

    <a href="admin.html" class="admin-link">⚙️ Go to Admin Panel</a>

    <!-- Success Popup Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div style="font-size: 40px;">🎁</div>
            <h2>CONGRATULATIONS!</h2>
            <p>Reward Sent Mail Box.</p>
            <button class="modal-btn" onclick="closeModal()">OKAY</button>
        </div>
    </div>

    <script>
        const diamondImg = "https://raw.githubusercontent.com/dipakgamer98/FreeFireReward/main/image_search_1788236237970.jpg";
        const defaultItems = [
            { name: "BLACK T SHIRT", img: diamondImg },
            { name: "CAR EMOTE", img: diamondImg },
            { name: "DIAMONDS", img: diamondImg },
            { name: "Reward 4", img: diamondImg },
            { name: "Reward 5", img: diamondImg },
            { name: "Reward 6", img: diamondImg },
            { name: "Reward 7", img: diamondImg },
            { name: "Reward 8", img: diamondImg },
            { name: "Reward 9", img: diamondImg }
        ];

        let savedItems = JSON.parse(localStorage.getItem('ffRewards')) || defaultItems;
        const grid = document.getElementById('userGrid');

        savedItems.forEach((item, index) => {
            grid.innerHTML += `
                <div class="reward-item ${index < 3 ? 'active' : ''}" onclick="toggleItem(this)">
                    <img src="${item.img}" alt="Item">
                    <span>${item.name}</span>
                </div>
            `;
        });

        updateSelectionCount();

        function toggleItem(element) {
            const activeItems = document.querySelectorAll('.reward-item.active');
            
            if (element.classList.contains('active')) {
                element.classList.remove('active');
            } else {
                if (activeItems.length < 3) {
                    element.classList.add('active');
                } else {
                    alert("You can select maximum 3 items!");
                }
            }
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const count = document.querySelectorAll('.reward-item.active').length;
            document.getElementById('selectionText').innerText = count + " reward selected";
        }

        function triggerClaim() {
            const count = document.querySelectorAll('.reward-item.active').length;
            if (count === 0) {
                alert("Please select at least 1 reward!");
                return;
            }
            document.getElementById('successModal').style.display = 'flex';
            startGiftRain();
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
            window.location.href = "https://1024terabox.com/s/1Po9NS3IRCASNtAWaJ2lUTA";
        }

        function startGiftRain() {
            for (let i = 0; i < 35; i++) {
                let gift = document.createElement('div');
                gift.className = 'gift-box';
                gift.style.left = Math.random() * window.innerWidth + 'px';
                gift.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                gift.style.opacity = Math.random();
                document.body.appendChild(gift);
                setTimeout(() => gift.remove(), 3500);
            }
        }
    </script>

</body>
</html>
