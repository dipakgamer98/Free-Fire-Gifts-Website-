<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE FIRE REWARDS</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }
        .header {
            text-align: center;
            padding: 20px 0 10px 0;
        }
        .header h1 {
            color: #ff9800;
            font-size: 22px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        .header p {
            color: #aaa;
            font-size: 11px;
            margin: 0;
        }
        .main-card {
            background-color: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 15px;
            width: 90%;
            max-width: 380px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.3);
            box-sizing: border-box;
        }
        .sub-header {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .instruction {
            font-size: 11px;
            color: #ccc;
            text-align: center;
            margin-bottom: 15px;
        }
        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }
        .reward-item {
            background-color: #262626;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .reward-item.active {
            border-color: #ff9800;
            background-color: #332211;
        }
        .reward-item img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        .reward-item span {
            font-size: 10px;
            color: #ddd;
            font-weight: bold;
        }
        .claim-btn {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-shadow: 0px 4px 10px rgba(255, 152, 0, 0.4);
            border: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .footer-note {
            font-size: 10px;
            color: #888;
            margin-top: 10px;
            text-align: center;
        }
        .admin-link {
            display: block;
            margin-top: 15px;
            color: #ff9800;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FREE FIRE REWARDS</h1>
        <p>👑 DIPAK GAMER</p>
    </div>

    <div class="main-card">
        <div class="sub-header">🏆 PREMIUM REWARDS COLLECTION</div>
        <div class="instruction">Select any item below to preview your choice.</div>

        <div class="rewards-grid" id="userGrid">
            <!-- Dynamically Loaded Items -->
        </div>

        <a href="https://1024terabox.com/s/1Janb2wegqWRxGjfHGf0ruA" class="claim-btn">CLAIM NOW</a>
        <div class="footer-note">Select any reward</div>
    </div>

    <a href="admin.html" class="admin-link">⚙️ Go to Admin Panel</a>

    <script>
        const defaultItems = [
            { name: "BUNNY BUNDLE", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "PIRATE FLAG", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "DIAMONDS", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 4", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 5", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 6", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 7", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 8", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" },
            { name: "Reward 9", img: "https://i.ibb.co/F4w6kS1D/Picsart-26-08-15-09.jpg" }
        ];

        let savedItems = JSON.parse(localStorage.getItem('ffRewards')) || defaultItems;
        const grid = document.getElementById('userGrid');

        savedItems.forEach((item, index) => {
            grid.innerHTML += `
                <div class="reward-item ${index === 0 ? 'active' : ''}" onclick="selectItem(this)">
                    <img src="${item.img}" alt="Item">
                    <span>${item.name}</span>
                </div>
            `;
        });

        function selectItem(element) {
            const items = document.querySelectorAll('.reward-item');
            items.forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
