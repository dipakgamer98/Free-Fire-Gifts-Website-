<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Gift Website</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .back-link {
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            align-self: flex-start;
            margin-bottom: 15px;
        }
        .admin-header {
            background-color: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .admin-header h2 {
            color: #ff9800;
            font-size: 18px;
            margin: 0 0 8px 0;
        }
        .admin-header p {
            font-size: 11px;
            color: #ccc;
            margin: 0;
            line-height: 1.4;
        }
        .section-title {
            color: #ff9800;
            font-size: 16px;
            font-weight: bold;
            align-self: flex-start;
            margin-bottom: 15px;
            max-width: 400px;
            width: 100%;
        }
        .item-box {
            background-color: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .preview-img {
            width: 50px;
            height: 50px;
            background-color: #262626;
            border-radius: 8px;
            border: 1px solid #ff9800;
            object-fit: cover;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 11px;
            color: #ff9800;
            font-weight: bold;
        }
        .input-group input {
            background-color: #262626;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            padding: 8px;
            font-size: 12px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #ff9800;
        }
        .remove-btn {
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>

    <a href="#" class="back-link">← Back to User Panel</a>
